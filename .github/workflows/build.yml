name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # osu!framework's AudioManager asserts that BASS reports at least TWO audio
      # devices (see its syncAudioDevices: "Bass did not provide any audio devices").
      # A bare runner has none, so BASS enumerates only its built-in "No sound" device,
      # the assertion fires while the first test's game host is booting, and the whole
      # test host dies — which is why ~153 non-visual tests passed and everything after
      # them was lost. libasound2 alone is enough: it adds ALSA's "Default" device,
      # taking the count to the required 2. No PulseAudio or sound hardware needed.
      - name: Install audio device for the test host
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2t64

      - name: Restore
        run: dotnet restore JukeBox.sln

      # xvfb provides the display osu!framework's game host expects.
      - name: Test
        run: xvfb-run -a dotnet test JukeBox.sln --no-restore --verbosity minimal

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64
          - name: macos-arm64
            os: macos-latest
            rid: osx-arm64
          - name: windows-x64
            os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish JukeBox.Desktop/JukeBox.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -o publish/${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: osu-JukeBox-${{ matrix.name }}
          path: publish/${{ matrix.name }}
          if-no-files-found: error
